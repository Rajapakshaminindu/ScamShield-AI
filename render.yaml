# Render Blueprint for ScamShield AI
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance -> pick this repo.
# Render reads this file and provisions the web service automatically.
services:
  - type: web
    name: scamshield-ai
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Matches the local venv, so the dependency set is already proven to build.
      - key: PYTHON_VERSION
        value: 3.13.3

      # OpenRouter API key — paste it in the Render dashboard.
      # Leave it blank and the app still runs in heuristic fallback mode.
      # Variable names are legacy but the client is OpenAI-compatible.
      - key: DASHSCOPE_API_KEY
        sync: false

      - key: DASHSCOPE_BASE_URL
        value: https://openrouter.ai/api/v1

      - key: QWEN_MODEL_NAME
        value: liquid/lfm-2.5-2.6b:free

      - key: QWEN_VL_MODEL_NAME
        value: google/gemma-4-31b-it:free

      # Render generates a strong random secret so JWTs can't be forged
      # using the placeholder default committed in the public repo.
      - key: JWT_SECRET
        generateValue: true

      # Seeded admin account. Set a real password in the dashboard —
      # without it the build falls back to the public default.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
